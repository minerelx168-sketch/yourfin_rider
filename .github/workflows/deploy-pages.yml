# Build the dashboard (dashboard/) and publish it to GitHub Pages.
#
# One-time setup in the repo:
#   1) Settings → Pages → Build and deployment → Source = "GitHub Actions"
#   2) Settings → Secrets and variables → Actions → Variables →
#      add a repository variable  VITE_API_URL = https://YOUR-API-HOST/api
#      (Pages serves static files only — host the backend + MySQL elsewhere)
#
# Site URL (project site): https://<owner>.github.io/yourfin_rider/
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Build (sub-path base + production API URL)
        run: npm run build
        env:
          # project site lives under /yourfin_rider/ (change if you use a custom domain at root)
          VITE_BASE: /yourfin_rider/
          # the hosted API; set as a repo variable (see header). Falls back to empty.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: SPA fallback for client-side routing on Pages
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
